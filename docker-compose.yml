# Three tiers as three concerns: web UI + API (app container) on PostgreSQL (db container).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: returns
      POSTGRES_DB: returns
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:returns@db:5432/returns
      SCALE: full
    ports: ["8000:8000"]
